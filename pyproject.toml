[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "memepilot"
version = "2.0.0a1"
description = "MemePilot Auto V2 — système de trading Solana contrôlé par des garde-fous déterministes"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jovial Elyas Bearivo" }]
dependencies = [
  "pydantic>=2.8,<3",
  "pyyaml>=6.0,<7",
  "cryptography>=43",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "hypothesis>=6.100",
  "mypy>=1.11",
  "ruff>=0.6",
  "types-PyYAML",
]

[tool.hatch.build.targets.wheel]
packages = ["src/memepilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"
markers = ["live_api: appelle la vraie API GMGN (désactivé par défaut)"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S603"]  # subprocess sans shell, arguments validés

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107"]
"src/memepilot/engine/dashboard.py" = ["E501"]  # gabarit HTML

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["memepilot"]
